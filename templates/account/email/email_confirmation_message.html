<!doctype html>

<head>

<body style="margin:0;background:#f8f9f4;color:#29332d;font-family:Arial,sans-serif;">

        <div style="background:#ffffff;border:1px solid #dce2d8;border-radius:16px;padding:32px;">
            <div style="font-size:14px;font-weight:800;letter-spacing:.2em;color:#58682f;">ALPES</div>
            <h1 style="margin:24px 0 12px;font-family:Georgia,serif;font-size:34px;font-weight:400;line-height:1.05;">Confirma tu correo electrónico.</h1>
            <p style="margin:0 0 20px;color:#66736b;line-height:1.7;">Gracias por crear tu cuenta en ALPES. Confirma que esta dirección de correo te pertenece para activar tu acceso.</p>
            <p style="margin:28px 0;">
                <a href="{{ activate_url }}" style="display:inline-block;background:#58682f;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:999px;">Confirmar correo</a>
            </p>
            <p style="margin:0;color:#66736b;font-size:13px;line-height:1.6;">Si no solicitaste esta cuenta, puedes ignorar este mensaje.</p>
        </div>
        <p style="margin:18px 0 0;text-align:center;color:#66736b;font-size:12px;">ALPES · Coaching · Liderazgo · Transformación</p>
    </div>
