name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alpes_ci
          POSTGRES_USER: alpes_ci
          POSTGRES_PASSWORD: alpes_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpes_ci -d alpes_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
      POSTGRES_DB: alpes_ci
      POSTGRES_USER: alpes_ci
      POSTGRES_PASSWORD: alpes_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Ruff
        run: ruff check apps config tests

      - name: Bandit
        run: bandit -q -r apps config -x tests

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Tests with coverage
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Production security check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy

      - name: Collect static files
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py collectstatic --noinput
